[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos-offline"
version = "0.8.0"
description = "PHAROS — integrated, offline-first local knowledge and services platform"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "PHAROS Project"}]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pypdf>=5.0,<8",  # Integrated Knowledge Base/RAG support
    "python-multipart>=0.0.9,<1",
    "tomlkit>=0.13,<1",
    "osmium>=4.0,<5",  # Streaming regional OSM PBF parser for optional geographic indexes
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pharos = "pharos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharos = ["web/*", "web/locales/*.json", "config.example.toml", "third_party_licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
