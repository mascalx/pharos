name: Tests
# CI on demand only: private-repository hosted runner quota is limited.
# Regular pushes continue to update PHAROS without starting billable jobs.
on:
  workflow_dispatch:
# Consolidate successive development pushes to the same branch.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit manual runs use only Ubuntu by default; Windows/macOS
        # compatibility is covered by local tests when needed.
        os: ['ubuntu-latest']
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '.[test]'
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax
        run: |
          node --check src/pharos/web/markdown.js
          node --check src/pharos/web/app.js
          node --check src/pharos/web/home.js
          node --check src/pharos/web/settings.js
          node --check src/pharos/web/knowledge.js
          node --check src/pharos/web/kiwix.js
          node --check src/pharos/web/jobs.js
          node --check src/pharos/web/updates.js
          node --check src/pharos/web/translations.js
          node --check src/pharos/web/maps.js
          node --check src/pharos/web/maps_viewer.js
          node --check src/pharos/web/maps_gpx.js
          node --check src/pharos/web/maps_search.js
          node --check src/pharos/web/kb_viewer.js
      - name: Maps browser regression smoke
        run: node tests/maps_ui_smoke.cjs
      - name: Offline geographic search UI smoke
        run: node tests/maps_search_ui_smoke.cjs
      - name: Offline maps viewport regression
        run: node tests/maps_viewer_smoke.cjs
      - name: Offline GPX UI regression
        run: node tests/maps_gpx_ui_smoke.cjs
      - name: Safe Markdown regression
        run: node tests/markdown_smoke.cjs
      - name: Automatic GPX import regression
        run: node tests/gpx_auto_import_smoke.cjs
      - name: Embedded Kiwix reader regression
        run: node tests/kiwix_reader_smoke.cjs
      - name: Embedded KB document viewer regression
        run: node tests/kb_viewer_smoke.cjs
      - name: Default Chat model regression
        run: node tests/chat_default_model_smoke.cjs

      - name: Ubuntu installer shell syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/install-ubuntu.sh
